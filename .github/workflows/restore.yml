name: Restauración de Cosmos DB

on:
  schedule:
    - cron: '0 6 * * 0'   # prueba de restauración cada domingo a las 06:00 UTC
  workflow_dispatch:
    inputs:
      respaldo:
        description: 'Nombre del respaldo (ej. tacnago-lugares-20261115T050000Z.json.gz) o "ultimo"'
        required: true
        default: 'ultimo'
      destino:
        description: 'Contenedor destino (Lugares-restore = prueba; Lugares = recuperación real)'
        required: true
        type: choice
        default: 'Lugares-restore'
        options:
          - Lugares-restore
          - Lugares

permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-tacnago-geraldzvallos
  STORAGE_ACCOUNT: sttacnagobkgerald
  BLOB_CONTAINER: cosmos-backups
  COSMOS_RG: rg-qa-bitacora
  COSMOS_ACCOUNT: qa-bitacora-cosmos-gzp
  COSMOS_DATABASE: TacnaGo
  COSMOS_CONTAINER: Lugares
  RESPALDO: ${{ inputs.respaldo || 'ultimo' }}
  DESTINO: ${{ inputs.destino || 'Lugares-restore' }}

jobs:
  restore:
    name: Restaurar y verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en Azure (service principal)
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Obtener endpoint y clave de Cosmos DB
        run: |
          ENDPOINT=$(az cosmosdb show --name "$COSMOS_ACCOUNT" --resource-group "$COSMOS_RG" --query documentEndpoint -o tsv)
          KEY=$(az cosmosdb keys list --name "$COSMOS_ACCOUNT" --resource-group "$COSMOS_RG" --type keys --query primaryMasterKey -o tsv)
          echo "::add-mask::$KEY"
          echo "COSMOS_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          echo "COSMOS_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Obtener la clave de la cuenta de respaldos
        run: |
          SKEY=$(az storage account keys list --account-name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query "[0].value" -o tsv)
          echo "::add-mask::$SKEY"
          echo "AZURE_STORAGE_KEY=$SKEY" >> "$GITHUB_ENV"
          echo "AZURE_STORAGE_ACCOUNT=$STORAGE_ACCOUNT" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar el SDK de Cosmos DB para Python
        run: pip install -r backup/requirements.txt

      - name: Descargar el respaldo desde Blob Storage
        run: |
          if [ "$RESPALDO" = "ultimo" ]; then
            BLOB=$(az storage blob list --container-name "$BLOB_CONTAINER" --prefix tacnago/ \
              --query "sort_by([], &properties.lastModified)[-1].name" -o tsv)
          else
            BLOB="tacnago/$RESPALDO"
          fi
          echo "Respaldo elegido: $BLOB"
          az storage blob download --only-show-errors --container-name "$BLOB_CONTAINER" \
            --name "$BLOB" --file respaldo.json.gz --output none
          ls -l respaldo.json.gz

      - name: Restaurar y verificar (restore.py)
        run: python backup/restore.py respaldo.json.gz "$DESTINO"
